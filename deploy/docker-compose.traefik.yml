services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: festa-da-arvore
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      PUBLIC_ORIGIN: https://festa-da-arvore.jacksondenis.tech
      TRUST_PROXY: "true"
      SITEMAP_LASTMOD: "2026-11-04"
      PUBLICATION_APPROVED: "true"
      ROBOTS_INDEXING: "true"
      LEADS_ENABLED: "false"
      PRIVACY_APPROVED: "false"
      DATA_DIR: /data
      WHATSAPP_TO: "5585985741485"
    volumes:
      - festa_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.festa-da-arvore.rule=Host(`festa-da-arvore.jacksondenis.tech`)
      - traefik.http.routers.festa-da-arvore.entrypoints=web,websecure
      - traefik.http.routers.festa-da-arvore.tls=true
      - traefik.http.routers.festa-da-arvore.tls.certresolver=mytlschallenge
      - traefik.http.services.festa-da-arvore.loadbalancer.server.port=4173

volumes:
  festa_data:

networks:
  proxy:
    external: true
    name: n8n_default
